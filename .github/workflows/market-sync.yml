name: Hourly Live Market Sync

on:
  schedule:
    # Runs at minute 0 past every hour
    - cron: '0 * * * *'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Optional Backend URL override (defaults to secret BACKEND_URL)'
        required: false
        type: string

jobs:
  sync-market-data:
    name: Sync Live Market Data
    runs-on: ubuntu-latest
    steps:
      - name: Send Sync Request to Backend
        run: |
          BACKEND_URL="${{ inputs.backend_url }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="${{ secrets.BACKEND_URL }}"
          fi

          if [ -z "$BACKEND_URL" ]; then
            echo "::error ::BACKEND_URL is not set! Please add BACKEND_URL in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip trailing slash if present
          BACKEND_URL="${BACKEND_URL%/}"

          echo "Pinging ${BACKEND_URL}/api/market/sync-live..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${BACKEND_URL}/api/market/sync-live")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Market data sync completed successfully!"
          else
            echo "::error ::Sync failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
